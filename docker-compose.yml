version: '3.8'

services:
  base_executor:
    build: ./executor
    container_name: base_executor
    ports:
      - "5000:5000"
    networks:
      - multiuavfogverse
    deploy:
      resources:
        limits:
          cpus: '4'      # Limit the service to 5 CPUs
          memory: 2g       # Limit the service to 2GB of memory
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    stdin_open: true
    tty: true

  base_client:
    build: ./client
    container_name: base_client
    ports:
      - "8000:8000"
    networks:
      - multiuavfogverse
    depends_on:
      - image_receiver
    deploy:
      resources:
        limits:
          cpus: '2' 
          memory: 1g      
  
  image_receiver:
    build:
      context: ./image_receiver
    ports:
      - "5001:5001"
    networks:
      - multiuavfogverse
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1g     

volumes:
  uav_data:
    driver: local

networks:
  multiuavfogverse:
    external: true